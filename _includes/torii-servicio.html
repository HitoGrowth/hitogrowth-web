{%- comment -%}

{%- endcomment -%}
<svg class="pp-torii pp-torii--{{ include.v }}" viewBox="0 0 400 340" aria-hidden="true">

  </g>
  <g class="pp-torii__motif">
  {%- case include.v -%}
  {%- when 'web' %}
    <rect x="128" y="160" width="144" height="110" rx="7"/>

    <circle class="nd" cx="136" cy="240" r="6"/><circle class="nd" cx="200" cy="240" r="6"/><circle class="nd" cx="200" cy="176" r="6"/>

    <circle class="tint ad-r ad-r3" cx="196" cy="240" r="24"/>

      <path d="M196 240l64-62"/>
      <path class="f" d="M260 178l18-4-9 13Z"/><path class="f" d="M260 178l4-18-13 9Z"/>

    <path class="gen-h" d="M122 300h156"/><path class="gen-h gen-h2" d="M140 314h120"/>
  {%- endcase %}

</svg>
