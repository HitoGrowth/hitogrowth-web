  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  {%- assign page_title = page.title | default: site.title -%}
  {%- assign page_desc = page.description | default: site.description | strip_html | strip_newlines | truncate: 160 -%}
  <title>{{ page_title }} · HitoGrowth</title>
  <meta name="description" content="{{ page_desc | escape }}">
  <meta name="theme-color" content="#08110D">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:locale" content="es_ES">
  <meta property="og:site_name" content="HitoGrowth">
  <meta property="og:title" content="{{ page_title | escape }}">
  <meta property="og:description" content="{{ page_desc | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ page.image | default: '/assets/img/carlos-gutierrez-dark.jpg' | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <link rel="stylesheet" href="/styles.css?v=17">
